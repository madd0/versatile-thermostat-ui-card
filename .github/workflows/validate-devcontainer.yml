name: Validate Devcontainer

on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - master
    paths:
      - '.devcontainer/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  test-devcontainer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run build

      - name: Check formatting
        run: npm run format -- --check
